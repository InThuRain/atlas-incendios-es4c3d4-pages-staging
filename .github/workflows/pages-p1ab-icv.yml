name: P1AB ICV exploration fixed staging
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Download immutable accepted P1AB ICV transport
        run: curl --fail --location --retry 3 --output p1ab-icv.tar.gz https://github.com/InThuRain/atlas-incendios-es4c3d4-pages-staging/releases/download/national-product-v1.0.2-staging-p1ab-icv/national-product-p1ab-icv-candidate.tar.gz
      - name: Gate transport, safe extraction and physical site identity
        run: python3 scripts/check_national_product_release_gate.py --contract config/national-product-p1ab-icv-candidate-identity.json --archive p1ab-icv.tar.gz --extract-to site --output runner-p1ab-icv-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: p1ab-icv-runner-identity
          path: runner-p1ab-icv-gate.json
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
